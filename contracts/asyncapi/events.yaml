asyncapi: 3.0.0
info:
  title: Core Platform Events
  version: 1.0.0
channels:
  userCreated:
    address: user.created.v1
    messages:
      userCreated:
        payload:
          type: object
          required: [id, type, version, source, occurredAt, data]
          properties:
            id: { type: string }
            type: { const: user.created }
            version: { const: 1 }
            source: { type: string }
            occurredAt: { type: string, format: date-time }
            data:
              type: object
              required: [id, displayName, status]
              properties:
                id: { type: string }
                displayName: { type: string }
                status: { type: string, enum: [active, deactivated, deleted] }
  userUpdated:
    address: user.updated.v1
    messages:
      userUpdated:
        payload:
          type: object
          required: [id, type, version, source, occurredAt, data]
          properties:
            id: { type: string }
            type: { const: user.updated }
            version: { const: 1 }
            source: { type: string }
            occurredAt: { type: string, format: date-time }
            data:
              type: object
              required: [id, displayName, status]
              properties:
                id: { type: string }
                displayName: { type: string }
                status: { type: string, enum: [active, deactivated, deleted] }
  userDeactivated:
    address: user.deactivated.v1
    messages:
      userDeactivated:
        payload:
          type: object
          required: [id, type, version, source, occurredAt, data]
          properties:
            id: { type: string }
            type: { const: user.deactivated }
            version: { const: 1 }
            source: { type: string }
            occurredAt: { type: string, format: date-time }
            data:
              type: object
              required: [id, displayName, status]
              properties:
                id: { type: string }
                displayName: { type: string }
                status: { type: string, enum: [active, deactivated, deleted] }
  userDeleted:
    address: user.deleted.v1
    messages:
      userDeleted:
        payload:
          type: object
          required: [id, type, version, source, occurredAt, data]
          properties:
            id: { type: string }
            type: { const: user.deleted }
            version: { const: 1 }
            source: { type: string }
            occurredAt: { type: string, format: date-time }
            data:
              type: object
              required: [id, displayName, status]
              properties:
                id: { type: string }
                displayName: { type: string }
                status: { type: string, enum: [active, deactivated, deleted] }
  applicationCreated:
    address: application.created.v1
    messages:
      applicationCreated:
        payload:
          type: object
          required: [id, type, version, source, occurredAt, data]
          properties:
            id: { type: string }
            type: { const: application.created }
            version: { const: 1 }
            source: { type: string }
            occurredAt: { type: string, format: date-time }
            data:
              type: object
              required: [id, slug, name, status]
              properties:
                id: { type: string }
                slug: { type: string }
                name: { type: string }
                status: { type: string, enum: [active, inactive, archived] }
  applicationUpdated:
    address: application.updated.v1
    messages:
      applicationUpdated:
        payload:
          type: object
          required: [id, type, version, source, occurredAt, data]
          properties:
            id: { type: string }
            type: { const: application.updated }
            version: { const: 1 }
            source: { type: string }
            occurredAt: { type: string, format: date-time }
            data:
              type: object
              required: [id, slug, name, status]
              properties:
                id: { type: string }
                slug: { type: string }
                name: { type: string }
                status: { type: string, enum: [active, inactive, archived] }
  relationshipCreated:
    address: relationship.created.v1
    messages:
      relationshipCreated:
        payload:
          type: object
          required: [id, type, version, source, occurredAt, data]
          properties:
            id: { type: string }
            type: { const: relationship.created }
            version: { const: 1 }
            source: { type: string }
            occurredAt: { type: string, format: date-time }
            data:
              type: object
              required: [id, requesterUserId, targetUserId, type, status]
              properties:
                id: { type: string }
                requesterUserId: { type: string }
                targetUserId: { type: string }
                type: { type: string, description: Product-defined relationship type (e.g. "friend", "follow") - never a fixed platform concept. }
                status: { type: string, enum: [pending, active, blocked, ended] }
operations:
  publishUserCreated:
    action: send
    channel: { $ref: '#/channels/userCreated' }
  publishRelationshipCreated:
    action: send
    channel: { $ref: '#/channels/relationshipCreated' }
  publishUserUpdated:
    action: send
    channel: { $ref: '#/channels/userUpdated' }
  publishUserDeactivated:
    action: send
    channel: { $ref: '#/channels/userDeactivated' }
  publishUserDeleted:
    action: send
    channel: { $ref: '#/channels/userDeleted' }
  publishApplicationCreated:
    action: send
    channel: { $ref: '#/channels/applicationCreated' }
  publishApplicationUpdated:
    action: send
    channel: { $ref: '#/channels/applicationUpdated' }
