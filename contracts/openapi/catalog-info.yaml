    components:
      securitySchemes:
        bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      schemas:
        Identity:
          type: object
          required: [id, provider, providerSubject, status]
          properties:
            id: { type: string, format: uuid }
            provider: { type: string }
            providerSubject: { type: string }
            status: { type: string, enum: [active, disabled] }
            userId: { type: string, format: uuid, nullable: true }
        User:
          type: object
          required: [id, displayName, locale, timezone, status, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
            avatarRef: { type: string }
            locale: { type: string }
            timezone: { type: string }
            status: { type: string, enum: [active, deactivated, deleted] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        UpdateUser:
          type: object
          description: At least one field is required. status may only be set to active or deactivated here - deletion is a dedicated operation, not exposed over this API yet.
          properties:
            displayName: { type: string }
            avatarRef: { type: string }
            locale: { type: string }
            timezone: { type: string }
            status: { type: string, enum: [active, deactivated] }
        Device:
          type: object
          required: [id, clientDeviceId, platform, locale, timezone, hasPushToken, sessionStatus, lastActiveAt, createdAt]
          properties:
            id: { type: string, format: uuid }
            clientDeviceId: { type: string, description: Client-generated, stable per install. }
            platform: { type: string }
            osVersion: { type: string }
            appVersion: { type: string }
            locale: { type: string }
            timezone: { type: string }
            hasPushToken: { type: boolean, description: The raw push token is never returned once registered. }
            sessionStatus: { type: string, enum: [active, revoked] }
            lastActiveAt: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
        RegisterDevice:
          type: object
          required: [clientDeviceId, platform]
          properties:
            clientDeviceId: { type: string }
            platform: { type: string }
            osVersion: { type: string }
            appVersion: { type: string }
            locale: { type: string }
            timezone: { type: string }
            pushToken: { type: string, description: Write-only - accepted here, never echoed back. }
        Tenant:
          type: object
          required: [id, appId, slug, name, status, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            appId: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
            status: { type: string, enum: [active, suspended] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        CreateTenant:
          type: object
          required: [appId, slug, name]
          properties:
            appId: { type: string, format: uuid }
            slug: { type: string, description: Lowercase alphanumeric with optional internal hyphens, unique per application. }
            name: { type: string }
        UpdateTenant:
          type: object
          description: At least one field is required.
          properties:
            name: { type: string }
            status: { type: string, enum: [active, suspended] }
        Membership:
          type: object
          required: [id, tenantId, userId, role, createdAt]
          properties:
            id: { type: string, format: uuid }
            tenantId: { type: string, format: uuid }
            userId: { type: string, format: uuid }
            role: { type: string, enum: [owner, admin, member] }
            createdAt: { type: string, format: date-time }
        AddMember:
          type: object
          required: [userId, role]
          properties:
            userId: { type: string, format: uuid }
            role: { type: string, enum: [owner, admin, member] }
        Group:
          type: object
          required: [id, appId, name, status, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            appId: { type: string, format: uuid }
            name: { type: string }
            status: { type: string, enum: [active, archived] }
            metadata: { type: object, additionalProperties: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        CreateGroup:
          type: object
          required: [appId, name]
          properties:
            appId: { type: string, format: uuid }
            name: { type: string }
            metadata: { type: object, additionalProperties: true }
        UpdateGroup:
          type: object
          description: At least one field is required.
          properties:
            name: { type: string }
            status: { type: string, enum: [active, archived] }
            metadata: { type: object, additionalProperties: true }
        GroupMember:
          type: object
          required: [id, groupId, userId, role, isManager, createdAt]
          properties:
            id: { type: string, format: uuid }
            groupId: { type: string, format: uuid }
            userId: { type: string, format: uuid }
            role: { type: string, description: "Product-defined free-form label (e.g. 'parent', 'leader', 'officer') - purely descriptive, never used for authorization." }
            isManager: { type: boolean, description: The one structural permission bit - independent of role. }
            createdAt: { type: string, format: date-time }
        AddGroupMember:
          type: object
          required: [userId]
          properties:
            userId: { type: string, format: uuid }
            role: { type: string }
            isManager: { type: boolean }
        UpdateGroupMember:
          type: object
          description: At least one field is required.
          properties:
            role: { type: string }
            isManager: { type: boolean }
        Relationship:
          type: object
          required: [id, appId, requesterUserId, targetUserId, type, status, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            appId: { type: string, format: uuid }
            requesterUserId: { type: string, format: uuid }
            targetUserId: { type: string, format: uuid }
            type: { type: string, description: "Product-defined (e.g. 'friend', 'follow', 'partner') - never a fixed platform concept." }
            status: { type: string, enum: [pending, active, blocked, ended] }
            metadata: { type: object, additionalProperties: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        RequestRelationship:
          type: object
          required: [appId, targetUserId, type]
          properties:
            appId: { type: string, format: uuid }
            targetUserId: { type: string, format: uuid }
            type: { type: string }
            metadata: { type: object, additionalProperties: true }
        Application:
          type: object
          required: [id, slug, name, status, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
            status: { type: string, enum: [active, inactive, archived] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        CreateApplication:
          type: object
          required: [slug, name]
          properties:
            slug: { type: string, description: Lowercase alphanumeric with optional internal hyphens. }
            name: { type: string }
        UpdateApplication:
          type: object
          description: At least one field is required.
          properties:
            name: { type: string }
            status: { type: string, enum: [active, inactive, archived] }
        Error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            correlationId: { type: string }
