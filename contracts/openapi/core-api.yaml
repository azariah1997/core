openapi: 3.1.0
info:
  title: Core Platform API
  version: 1.0.0
servers:
  - url: /v1
paths:
  /platform:
    get:
      operationId: getPlatform
      responses:
        '200': { description: Platform metadata }
  /users/me:
    get:
      operationId: getCurrentUser
      description: Resolves to the caller's own User, provisioning and linking one to their Identity on first login.
      security:
        - bearerAuth: []
      responses:
        '200': { description: The caller's own User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { description: Missing, malformed or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUser' }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Missing, malformed or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /users/{id}:
    get:
      operationId: getUser
      description: Visible to the user themselves or a platform.admin. Fine-grained relationship-based visibility (e.g. via a real connection between users) lands in Phase 8.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { description: Missing, malformed or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not allowed to view this user, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /users/me/devices:
    post:
      operationId: registerDevice
      description: Registers or re-registers a device, upserted by clientDeviceId. Re-registering a revoked device reactivates it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDevice' }
      responses:
        '200': { description: The registered device, content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Missing, malformed or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      operationId: listDevices
      description: The caller's own active (non-revoked) devices, unpaginated - inherently small per user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Device' } }
        '401': { description: Missing, malformed or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /users/me/devices/{id}:
    delete:
      operationId: revokeDevice
      description: Revokes (soft-deletes) the device, ending its session. Only the owning user may revoke their own device.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Revoked }
        '401': { description: Missing, malformed or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /data/query:
    post:
      deprecated: true
      description: Intentionally unsupported. Products must use domain contracts instead of generic database access.
      responses:
        '501': { description: Generic DB query disabled }
  /apps:
    post:
      operationId: createApplication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApplication' }
      responses:
        '201': { description: Application created, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Slug already in use, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      operationId: listApplications
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque cursor from a previous response's nextCursor. }
      responses:
        '200':
          description: A page of applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Application' } }
                  nextCursor: { type: string, description: Empty when there is no further page. }
  /apps/{id}:
    get:
      operationId: getApplication
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Application, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      operationId: updateApplication
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateApplication' }
      responses:
        '200': { description: Updated application, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /identity/me:
    get:
      operationId: getCurrentIdentity
      security:
        - bearerAuth: []
      responses:
        '200': { description: The identity resolved from the bearer token, content: { application/json: { schema: { $ref: '#/components/schemas/Identity' } } } }
        '401': { description: Missing, malformed or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Identity:
      type: object
      required: [id, provider, providerSubject, status]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        providerSubject: { type: string }
        status: { type: string, enum: [active, disabled] }
        userId: { type: string, format: uuid, nullable: true }
    User:
      type: object
      required: [id, displayName, locale, timezone, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        avatarRef: { type: string }
        locale: { type: string }
        timezone: { type: string }
        status: { type: string, enum: [active, deactivated, deleted] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateUser:
      type: object
      description: At least one field is required. status may only be set to active or deactivated here - deletion is a dedicated operation, not exposed over this API yet.
      properties:
        displayName: { type: string }
        avatarRef: { type: string }
        locale: { type: string }
        timezone: { type: string }
        status: { type: string, enum: [active, deactivated] }
    Device:
      type: object
      required: [id, clientDeviceId, platform, locale, timezone, hasPushToken, sessionStatus, lastActiveAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        clientDeviceId: { type: string, description: Client-generated, stable per install. }
        platform: { type: string }
        osVersion: { type: string }
        appVersion: { type: string }
        locale: { type: string }
        timezone: { type: string }
        hasPushToken: { type: boolean, description: The raw push token is never returned once registered. }
        sessionStatus: { type: string, enum: [active, revoked] }
        lastActiveAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    RegisterDevice:
      type: object
      required: [clientDeviceId, platform]
      properties:
        clientDeviceId: { type: string }
        platform: { type: string }
        osVersion: { type: string }
        appVersion: { type: string }
        locale: { type: string }
        timezone: { type: string }
        pushToken: { type: string, description: Write-only - accepted here, never echoed back. }
    Application:
      type: object
      required: [id, slug, name, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, inactive, archived] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateApplication:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, description: Lowercase alphanumeric with optional internal hyphens. }
        name: { type: string }
    UpdateApplication:
      type: object
      description: At least one field is required.
      properties:
        name: { type: string }
        status: { type: string, enum: [active, inactive, archived] }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
