openapi: 3.1.0
info:
  title: Core Platform API
  version: 1.0.0
servers:
  - url: /v1
paths:
  /platform:
    get:
      operationId: getPlatform
      responses:
        '200': { description: Platform metadata }
  /users/me:
    get:
      operationId: getCurrentUser
      description: Resolves to the caller's own User, provisioning and linking one to their Identity on first login.
      security:
        - bearerAuth: []
      responses:
        '200': { description: The caller's own User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { description: Missing, malformed or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUser' }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Missing, malformed or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /users/{id}:
    get:
      operationId: getUser
      description: Visible to the user themselves or a platform.admin. Fine-grained relationship-based visibility (e.g. via a real connection between users) lands in Phase 8.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { description: Missing, malformed or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not allowed to view this user, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /users/me/devices:
    post:
      operationId: registerDevice
      description: Registers or re-registers a device, upserted by clientDeviceId. Re-registering a revoked device reactivates it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDevice' }
      responses:
        '200': { description: The registered device, content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Missing, malformed or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      operationId: listDevices
      description: The caller's own active (non-revoked) devices, unpaginated - inherently small per user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Device' } }
        '401': { description: Missing, malformed or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /users/me/devices/{id}:
    delete:
      operationId: revokeDevice
      description: Revokes (soft-deletes) the device, ending its session. Only the owning user may revoke their own device.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Revoked }
        '401': { description: Missing, malformed or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /tenants:
    post:
      operationId: createTenant
      description: Any authenticated caller may create a tenant, becoming its owner.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTenant' }
      responses:
        '201': { description: Tenant created, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Slug already in use for this application, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      operationId: listMyTenants
      description: Tenants the caller is a member of.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's tenants
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Tenant' } }
  /tenants/{id}:
    get:
      operationId: getTenant
      description: Visible to members only.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Tenant, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '403': { description: Not a member of this tenant, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      operationId: updateTenant
      description: Requires the owner or admin role.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTenant' }
      responses:
        '200': { description: Updated tenant, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Owner or admin role required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /tenants/{id}/members:
    get:
      operationId: listTenantMembers
      description: Visible to members only.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tenant members
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Membership' } }
        '403': { description: Not a member of this tenant, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      operationId: addTenantMember
      description: Requires the owner or admin role.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMember' }
      responses:
        '201': { description: Membership created, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Owner or admin role required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: User is already a member, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /tenants/{id}/members/{userId}:
    delete:
      operationId: removeTenantMember
      description: A member may remove themselves; removing anyone else requires the owner or admin role.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '403': { description: Owner or admin role required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /relationships:
    post:
      operationId: requestRelationship
      description: Creates a pending relationship, or revives one back to pending if the only existing row for this pair+type has ended. type is product-defined (e.g. "friend", "follow") - the platform never hardcodes relationship semantics.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestRelationship' }
      responses:
        '201': { description: Relationship created, content: { application/json: { schema: { $ref: '#/components/schemas/Relationship' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: A live (pending/active/blocked) relationship already exists for this pair and type, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      operationId: listMyRelationships
      description: Relationships the caller is a participant in.
      security:
        - bearerAuth: []
      parameters:
        - { name: appId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, active, blocked, ended] } }
      responses:
        '200':
          description: The caller's relationships
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Relationship' } }
  /relationships/{id}:
    get:
      operationId: getRelationship
      description: Visible to participants only.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Relationship, content: { application/json: { schema: { $ref: '#/components/schemas/Relationship' } } } }
        '403': { description: Not a participant, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      operationId: removeRelationship
      description: Cancels a pending request (requester only) or ends an active relationship (either participant).
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '403': { description: Not permitted, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Relationship is not in a state that allows removal, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /relationships/{id}/accept:
    post:
      operationId: acceptRelationship
      description: Only the target (recipient) of a pending request may accept.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Relationship is now active, content: { application/json: { schema: { $ref: '#/components/schemas/Relationship' } } } }
        '403': { description: Only the target may accept, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Relationship is not pending, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /relationships/{id}/decline:
    post:
      operationId: declineRelationship
      description: Only the target (recipient) of a pending request may decline.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Relationship is now ended, content: { application/json: { schema: { $ref: '#/components/schemas/Relationship' } } } }
        '403': { description: Only the target may decline, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Relationship is not pending, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /relationships/block:
    post:
      operationId: blockUser
      description: Works whether or not a relationship already exists - blocking a stranger creates one directly in the blocked state; blocking an existing relationship transitions it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestRelationship' }
      responses:
        '200': { description: Relationship is now blocked, content: { application/json: { schema: { $ref: '#/components/schemas/Relationship' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /groups:
    post:
      operationId: createGroup
      description: Any authenticated caller may create a group, becoming its first manager. Friend circles, families, teams, communities, workspaces, guilds are all the same resource - the platform never hardcodes one use case.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroup' }
      responses:
        '201': { description: Group created, content: { application/json: { schema: { $ref: '#/components/schemas/Group' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      operationId: listMyGroups
      description: Groups the caller is a member of.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Group' } }
  /groups/{id}:
    get:
      operationId: getGroup
      description: Visible to members only.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Group, content: { application/json: { schema: { $ref: '#/components/schemas/Group' } } } }
        '403': { description: Not a member of this group, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      operationId: updateGroup
      description: Requires manager permission.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGroup' }
      responses:
        '200': { description: Updated group, content: { application/json: { schema: { $ref: '#/components/schemas/Group' } } } }
        '403': { description: Manager permission required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /groups/{id}/members:
    get:
      operationId: listGroupMembers
      description: Visible to members only.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Group members
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/GroupMember' } }
        '403': { description: Not a member of this group, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      operationId: addGroupMember
      description: Requires manager permission.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddGroupMember' }
      responses:
        '201': { description: Membership created, content: { application/json: { schema: { $ref: '#/components/schemas/GroupMember' } } } }
        '403': { description: Manager permission required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: User is already a member, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /groups/{id}/members/{userId}:
    patch:
      operationId: updateGroupMember
      description: Changes a member's role label and/or manager permission. Requires manager permission - a plain member can never grant themselves or anyone else manager status.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGroupMember' }
      responses:
        '200': { description: Updated membership, content: { application/json: { schema: { $ref: '#/components/schemas/GroupMember' } } } }
        '403': { description: Manager permission required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      operationId: removeGroupMember
      description: A member may remove themselves; removing anyone else requires manager permission.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '403': { description: Manager permission required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /data/query:
    post:
      deprecated: true
      description: Intentionally unsupported. Products must use domain contracts instead of generic database access.
      responses:
        '501': { description: Generic DB query disabled }
  /apps:
    post:
      operationId: createApplication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApplication' }
      responses:
        '201': { description: Application created, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Slug already in use, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      operationId: listApplications
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque cursor from a previous response's nextCursor. }
      responses:
        '200':
          description: A page of applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Application' } }
                  nextCursor: { type: string, description: Empty when there is no further page. }
  /apps/{id}:
    get:
      operationId: getApplication
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Application, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      operationId: updateApplication
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateApplication' }
      responses:
        '200': { description: Updated application, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /identity/me:
    get:
      operationId: getCurrentIdentity
      security:
        - bearerAuth: []
      responses:
        '200': { description: The identity resolved from the bearer token, content: { application/json: { schema: { $ref: '#/components/schemas/Identity' } } } }
        '401': { description: Missing, malformed or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Identity:
      type: object
      required: [id, provider, providerSubject, status]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        providerSubject: { type: string }
        status: { type: string, enum: [active, disabled] }
        userId: { type: string, format: uuid, nullable: true }
    User:
      type: object
      required: [id, displayName, locale, timezone, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        avatarRef: { type: string }
        locale: { type: string }
        timezone: { type: string }
        status: { type: string, enum: [active, deactivated, deleted] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateUser:
      type: object
      description: At least one field is required. status may only be set to active or deactivated here - deletion is a dedicated operation, not exposed over this API yet.
      properties:
        displayName: { type: string }
        avatarRef: { type: string }
        locale: { type: string }
        timezone: { type: string }
        status: { type: string, enum: [active, deactivated] }
    Device:
      type: object
      required: [id, clientDeviceId, platform, locale, timezone, hasPushToken, sessionStatus, lastActiveAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        clientDeviceId: { type: string, description: Client-generated, stable per install. }
        platform: { type: string }
        osVersion: { type: string }
        appVersion: { type: string }
        locale: { type: string }
        timezone: { type: string }
        hasPushToken: { type: boolean, description: The raw push token is never returned once registered. }
        sessionStatus: { type: string, enum: [active, revoked] }
        lastActiveAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    RegisterDevice:
      type: object
      required: [clientDeviceId, platform]
      properties:
        clientDeviceId: { type: string }
        platform: { type: string }
        osVersion: { type: string }
        appVersion: { type: string }
        locale: { type: string }
        timezone: { type: string }
        pushToken: { type: string, description: Write-only - accepted here, never echoed back. }
    Tenant:
      type: object
      required: [id, appId, slug, name, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        appId: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateTenant:
      type: object
      required: [appId, slug, name]
      properties:
        appId: { type: string, format: uuid }
        slug: { type: string, description: Lowercase alphanumeric with optional internal hyphens, unique per application. }
        name: { type: string }
    UpdateTenant:
      type: object
      description: At least one field is required.
      properties:
        name: { type: string }
        status: { type: string, enum: [active, suspended] }
    Membership:
      type: object
      required: [id, tenantId, userId, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { type: string, enum: [owner, admin, member] }
        createdAt: { type: string, format: date-time }
    AddMember:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [owner, admin, member] }
    Group:
      type: object
      required: [id, appId, name, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        appId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, archived] }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateGroup:
      type: object
      required: [appId, name]
      properties:
        appId: { type: string, format: uuid }
        name: { type: string }
        metadata: { type: object, additionalProperties: true }
    UpdateGroup:
      type: object
      description: At least one field is required.
