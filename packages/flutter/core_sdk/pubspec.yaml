name: core_sdk
description: >
  Dart client for Core Platform - the SDK future products (starting with
  apps/mobile) should primarily interact with core-api and
  realtime-gateway through. A pure Dart package (no Flutter SDK
  dependency) so it's usable and testable outside a Flutter app too.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  http: ^1.2.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
