auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Loki's own native OTLP ingestion endpoint (POST /otlp/v1/logs) is what
# lets it accept logs directly from the OTel Collector's otlphttp
# exporter (see otel-collector.yaml's logs pipeline) - no separate
# log-shipping agent (e.g. Promtail) needed, and no config here beyond
# the defaults is required to enable it.
limits_config:
  allow_structured_metadata: true
