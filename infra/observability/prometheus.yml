global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: core-api
    static_configs: [{ targets: ["host.docker.internal:8080"] }]
  - job_name: realtime
    static_configs: [{ targets: ["host.docker.internal:8090"] }]
  - job_name: worker
    static_configs: [{ targets: ["host.docker.internal:8091"] }]
