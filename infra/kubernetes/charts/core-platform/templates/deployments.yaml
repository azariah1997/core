{{- $root := . -}}
{{- range $name, $svc := dict "core-api" .Values.coreApi "realtime-gateway" .Values.realtime "worker" .Values.worker }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels: { app: {{ $name }} }
  template:
    metadata:
      labels: { app: {{ $name }} }
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.global.imageRegistry }}/{{ $svc.image }}:{{ $root.Values.global.imageTag }}"
          ports: [{ containerPort: {{ $svc.port }} }]
          env:
            - { name: PLATFORM_ENV, value: "{{ $root.Values.config.platformEnv }}" }
            - { name: PLATFORM_NAME, value: "{{ $root.Values.config.platformName }}" }
          readinessProbe:
            httpGet: { path: /healthz, port: {{ $svc.port }} }
          livenessProbe:
            httpGet: { path: /healthz, port: {{ $svc.port }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: { app: {{ $name }} }
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
