apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/core-platform.git
    targetRevision: main
    path: infra/kubernetes/charts/core-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: core-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
